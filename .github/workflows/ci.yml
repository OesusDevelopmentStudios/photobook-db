#
# Tests and style check, on the oldest and the newest Python the project supports. The release workflow
# runs this too, before it publishes anything.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]  # requires-python in pyproject.toml, and the container's Python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: flake8
      - run: shellcheck deploy/install.sh  # tests/deploy run it with sh, which is dash here
